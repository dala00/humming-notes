<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humming Notes</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Text is English here; app.js swaps in the chosen language through data-i18n / data-i18n-title (see /lib/i18n.mjs). -->
<header>
  <h1>Humming Notes</h1>
  <label data-i18n-title="h.songTitle"><span data-i18n="h.song">Song</span> <select id="song"></select></label>
  <button id="songNew" data-i18n="h.songNew" data-i18n-title="h.songNewTitle">New song</button>
  <button id="songCopy" data-i18n="h.songCopy" data-i18n-title="h.songCopyTitle">Duplicate</button>
  <button id="songRename" data-i18n="h.songRename" data-i18n-title="h.songRenameTitle">Rename</button>
  <label><span data-i18n="h.bpm">BPM</span> <input id="bpm" type="number" min="30" max="300" step="1"></label>
  <label><span data-i18n="h.beats">Beats</span> <input id="beatsPerBar" type="number" min="1" max="12" step="1"> /4</label>
  <label><input id="metronome" type="checkbox"> <span data-i18n="h.metronome">Metronome</span></label>
  <label><span data-i18n="h.countIn">Count-in</span> <input id="countInBars" type="number" min="0" max="4" step="1"> <span data-i18n="h.bars">bars</span></label>
  <label data-i18n-title="h.snapTitle"><input id="snapToScale" type="checkbox"> <span data-i18n="h.snap">Snap to key</span></label>
  <label data-i18n-title="h.soundfontTitle"><span data-i18n="h.soundfont">Sounds</span> <select id="soundfont"></select></label>
  <label data-i18n-title="h.reverbTitle"><span data-i18n="h.reverb">Reverb</span> <input id="reverb" type="range" min="0" max="0.6" step="0.05"></label>
  <label data-i18n-title="h.latencyTitle"><span data-i18n="h.latency">Latency fix</span> <input id="latencyMs" type="number" step="10"> ms</label>
  <button id="calibrate" data-i18n="h.calibrate" data-i18n-title="h.calibrateTitle">Measure latency</button>
  <span class="spacer"></span>
  <label><span data-i18n="h.lang">Language</span> <select id="lang"></select></label>
</header>

<section class="transport">
  <button id="rec" class="rec">● Record</button>
  <label><span data-i18n="t.nextInstrument">Instrument for the next take</span> <select id="nextInstrument"></select></label>
  <label data-i18n-title="t.draftTitle"><input id="draft" type="checkbox"> <span data-i18n="t.draft">Draft recording (layer your voice, convert everything later)</span></label>
  <button id="play" data-i18n="t.play">▶ Play</button>
  <button id="stop" data-i18n="t.stop">■ Stop</button>
  <button id="undo" title="Ctrl+Z" data-i18n="t.undo">↶ Undo</button>
  <span class="spacer"></span>
  <span class="meter" data-i18n-title="t.meterTitle"><span id="level"></span></span>
  <span id="clock">0:00.0</span>
  <span class="spacer"></span>
  <button id="exportMp3" data-i18n="t.exportMp3">Export MP3</button>
  <button id="exportWav">WAV</button>
  <button id="exportMidi">MIDI</button>
</section>

<div id="status" class="status"></div>

<section class="roll">
  <canvas id="canvas"></canvas>
</section>
<p class="hint" data-i18n="roll.hint">
  Piano roll: click to set where playback and recording start; click a note to select it. Space plays and stops.
</p>

<section>
  <table id="tracks">
    <thead>
      <tr>
        <th></th>
        <th data-i18n="th.name">Track name</th>
        <th data-i18n="th.instrument">Instrument</th>
        <th data-i18n="th.volume">Volume</th>
        <th data-i18n="th.pan">Pan (left ↔ right)</th>
        <th data-i18n="th.mute">Mute</th>
        <th data-i18n="th.transpose">Transpose (semitones)</th>
        <th data-i18n="th.quantize">Quantize</th>
        <th data-i18n="th.offset">Shift (ms)</th>
        <th data-i18n="th.notes">Notes</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="empty" class="hint"><span data-i18n="empty.calibrate"></span><br><span data-i18n="empty.start"></span></p>
</section>

<footer class="hint">
  <span data-i18n="footer.before">Changes are saved automatically to</span> <code id="projectPath">project.json</code><span data-i18n="footer.after">.</span>
</footer>

<dialog id="songDialog">
  <form id="songForm">
    <label><span id="songDialogTitle"></span><br><input id="songDialogName" type="text" size="28" maxlength="60" autocomplete="off"></label>
    <div id="songDialogError" class="status error"></div>
    <div class="buttons">
      <button type="button" id="songDialogCancel" data-i18n="dialog.cancel">Cancel</button>
      <button type="submit" id="songDialogOk" data-i18n="dialog.ok">OK</button>
    </div>
  </form>
</dialog>

<script src="/vendor/lame.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
